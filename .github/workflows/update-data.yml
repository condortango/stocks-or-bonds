name: Update data

on:
  schedule:
    # 13:17 UTC daily = 6:17 AM PDT (5:17 AM PST). Treasury and FRED have posted the
    # prior trading day by then. FactSet's Friday report is picked up on Saturday's run.
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write # commit data.json
  pages: write    # request a Pages build (pushes made with GITHUB_TOKEN do not trigger one)

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pypdf
        run: python -m pip install --disable-pip-version-check "pypdf==6.19.0"

      - name: Refresh data.json
        run: python scripts/update_data.py

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet -- data.json; then
            echo "data.json unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff -- data.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update data.json ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '.status' \
            || echo "::warning::Pages build request failed; the site will update on the next push"
